<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" role="img" aria-labelledby="arch-title">
  <title id="arch-title">Three-tier architecture</title>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
  <g id="layer-client">
    <rect x="20" y="20" width="100" height="50" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="70" y="50" text-anchor="middle" font-size="12" fill="#0c4a6e">Client</text>
  </g>
  <line x1="120" y1="45" x2="160" y2="45" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <g id="layer-api">
    <rect x="160" y="20" width="100" height="50" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="210" y="50" text-anchor="middle" font-size="12" fill="#78350f">API</text>
  </g>
  <line x1="260" y1="45" x2="300" y2="45" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <g id="layer-external">
    <rect x="300" y="20" width="100" height="50" rx="6" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="350" y="50" text-anchor="middle" font-size="12" fill="#581c87">CDN</text>
  </g>
  <line x1="210" y1="70" x2="210" y2="110" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <ellipse cx="210" cy="120" rx="50" ry="10" fill="#f1f5f9" stroke="#64748b"/>
  <rect x="160" y="120" width="100" height="50" fill="#f1f5f9" stroke="#64748b"/>
  <ellipse cx="210" cy="170" rx="50" ry="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="210" y="152" text-anchor="middle" font-size="12" fill="#334155">Database</text>
</svg>
