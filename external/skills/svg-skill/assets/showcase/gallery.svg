<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="g-title">
  <title id="g-title">svg-skill gallery</title>
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="960" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <pattern id="g-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#fff" opacity="0.05"/>
    </pattern>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="960" height="640" fill="url(#g-bg)"/>
  <rect width="960" height="640" fill="url(#g-grid)"/>

  <!-- card template positions: 3x2 grid -->
  <!-- 1 icons -->
  <g transform="translate(32,32)" filter="url(#sh)">
    <rect width="288" height="280" rx="20" fill="#18181b" stroke="#27272a"/>
    <text x="24" y="36" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#e4e4e7">UI Icons</text>
    <text x="24" y="54" font-family="system-ui,sans-serif" font-size="11" fill="#71717a">stroke / fill / multicolor</text>
    <rect x="24" y="72" width="240" height="176" rx="12" fill="#09090b" stroke="#27272a"/>
    <g transform="translate(48,108)" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#a78bfa"><circle cx="22" cy="22" r="10"/><path d="M30 30l5 5"/></g>
      <g transform="translate(68,0)" stroke="#4ade80"><path d="M22 8l5 10 11 1.6-8 7.8 1.9 11L22 30l-9.9 5.2 1.9-11-8-7.8L17 18z" fill="#4ade80" stroke="none"/></g>
      <g transform="translate(136,0)" stroke="#38bdf8"><path d="M22 6C15 6 10 11 10 18c0 9 12 20 12 20s12-11 12-20c0-7-5-12-12-12z" fill="#38bdf8" stroke="none"/><circle cx="22" cy="16" r="4" fill="#09090b"/></g>
      <g transform="translate(204,0)" stroke="#fbbf24"><circle cx="22" cy="22" r="10"/><path d="M22 14v5l3 2"/></g>
    </g>
    <g transform="translate(48,188)" fill="none" stroke-width="2.2" stroke-linecap="round">
      <g stroke="#fb7185"><path d="M10 14h24M10 22h16M10 30h20"/><rect x="8" y="8" width="28" height="28" rx="5"/></g>
      <g transform="translate(68,0)" stroke="#c084fc"><path d="M22 6v32M6 22h32"/><circle cx="22" cy="22" r="14"/></g>
      <g transform="translate(136,0)" stroke="#2dd4bf"><path d="M8 30l8-16 8 10 8-18 8 24"/></g>
    </g>
  </g>

  <!-- 2 charts -->
  <g transform="translate(336,32)" filter="url(#sh)">
    <rect width="288" height="280" rx="20" fill="#18181b" stroke="#27272a"/>
    <text x="24" y="36" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#e4e4e7">Charts</text>
    <text x="24" y="54" font-family="system-ui,sans-serif" font-size="11" fill="#71717a">bar / line / pie</text>
    <rect x="24" y="72" width="112" height="176" rx="12" fill="#09090b" stroke="#27272a"/>
    <rect x="40" y="180" width="16" height="48" rx="2" fill="#6366f1"/>
    <rect x="64" y="152" width="16" height="76" rx="2" fill="#818cf8"/>
    <rect x="88" y="168" width="16" height="60" rx="2" fill="#6366f1"/>
    <rect x="112" y="132" width="16" height="96" rx="2" fill="#a78bfa"/>
    <polyline points="48,196 72,168 96,178 120,140" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
    <rect x="152" y="72" width="112" height="176" rx="12" fill="#09090b" stroke="#27272a"/>
    <path d="M208 180 A44 44 0 0 1 252 148 L208 180Z" fill="#6366f1"/>
    <path d="M208 180 A44 44 0 0 1 168 148 L208 180Z" fill="#8b5cf6"/>
    <path d="M208 180 A44 44 0 0 1 208 136 L208 180Z" fill="#c4b5fd"/>
    <circle cx="208" cy="180" r="20" fill="#09090b"/>
  </g>

  <!-- 3 diagram -->
  <g transform="translate(640,32)" filter="url(#sh)">
    <rect width="288" height="280" rx="20" fill="#18181b" stroke="#27272a"/>
    <text x="24" y="36" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#e4e4e7">Diagrams</text>
    <text x="24" y="54" font-family="system-ui,sans-serif" font-size="11" fill="#71717a">flow / architecture</text>
    <rect x="24" y="72" width="240" height="100" rx="12" fill="#09090b" stroke="#27272a"/>
    <rect x="40" y="100" width="52" height="32" rx="6" fill="#1e3a5f" stroke="#3b82f6"/>
    <rect x="118" y="100" width="52" height="32" rx="6" fill="#422006" stroke="#f59e0b"/>
    <rect x="196" y="100" width="52" height="32" rx="6" fill="#3b0764" stroke="#a855f7"/>
    <line x1="92" y1="116" x2="118" y2="116" stroke="#52525b" stroke-width="2"/>
    <line x1="170" y1="116" x2="196" y2="116" stroke="#52525b" stroke-width="2"/>
    <rect x="24" y="188" width="240" height="60" rx="12" fill="#09090b" stroke="#27272a"/>
    <rect x="80" y="204" width="56" height="28" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <ellipse cx="108" cy="248" rx="28" ry="6" fill="#27272a"/>
    <rect x="80" y="220" width="56" height="28" fill="#27272a" opacity="0.5"/>
    <line x1="108" y1="204" x2="108" y2="220" stroke="#52525b" stroke-dasharray="4 2"/>
    <rect x="160" y="210" width="72" height="36" rx="6" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="5 3"/>
  </g>

  <!-- 4 illustration -->
  <g transform="translate(32,328)" filter="url(#sh)">
    <rect width="288" height="280" rx="20" fill="#18181b" stroke="#27272a"/>
    <text x="24" y="36" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#e4e4e7">Illustration</text>
    <text x="24" y="54" font-family="system-ui,sans-serif" font-size="11" fill="#71717a">empty state / decor</text>
    <rect x="24" y="72" width="240" height="176" rx="12" fill="#09090b" stroke="#27272a"/>
    <path d="M72 160 144 120l72 40v56H72v-56z" fill="#27272a" stroke="#52525b" stroke-width="1.5"/>
    <circle cx="196" cy="136" r="16" fill="#18181b" stroke="#52525b" stroke-width="1.5"/>
    <path d="M188 136h16M196 128v16" stroke="#71717a" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="144" cy="88" r="22" fill="#fbbf24"/>
    <g stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round">
      <line x1="144" y1="54" x2="144" y2="64"/><line x1="144" y1="112" x2="144" y2="122"/>
      <line x1="110" y1="88" x2="120" y2="88"/><line x1="168" y1="88" x2="178" y2="88"/>
    </g>
  </g>

  <!-- 5 motion -->
  <g transform="translate(336,328)" filter="url(#sh)">
    <rect width="288" height="280" rx="20" fill="#18181b" stroke="#27272a"/>
    <text x="24" y="36" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#e4e4e7">Motion</text>
    <text x="24" y="54" font-family="system-ui,sans-serif" font-size="11" fill="#71717a">spinner / progress / hover</text>
    <rect x="24" y="72" width="240" height="176" rx="12" fill="#09090b" stroke="#27272a"/>
    <circle cx="88" cy="160" r="36" fill="none" stroke="#27272a" stroke-width="6"/>
    <circle cx="88" cy="160" r="36" fill="none" stroke="#a78bfa" stroke-width="6" stroke-dasharray="140 90" stroke-linecap="round" transform="rotate(-90 88 160)"/>
    <path d="M176 140c0-8 7-14 16-14s16 6 16 14-7 18-16 28-16-20-16-28z" fill="#fb7185"/>
    <rect x="176" y="180" width="72" height="10" rx="5" fill="#27272a"/>
    <rect x="176" y="180" width="48" height="10" rx="5" fill="#4ade80"/>
    <path d="M40 100h64" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M200 100h40" stroke="#4ade80" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- 6 brand + integration -->
  <g transform="translate(640,328)" filter="url(#sh)">
    <rect width="288" height="280" rx="20" fill="#18181b" stroke="#27272a"/>
    <text x="24" y="36" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#e4e4e7">Brand &amp; Code</text>
    <text x="24" y="54" font-family="system-ui,sans-serif" font-size="11" fill="#71717a">logo / react / sprite</text>
    <rect x="24" y="72" width="240" height="176" rx="12" fill="#09090b" stroke="#27272a"/>
    <circle cx="88" cy="148" r="40" fill="#2563eb"/>
    <path d="M88 118c-5 7-10 10-10 16a10 10 0 1 0 20 0c0-6-5-9-10-16z" fill="#fff"/>
    <rect x="148" y="108" width="40" height="40" rx="8" fill="#2563eb"/>
    <path d="M158 128c-2 3-4 4-4 7a4 4 0 1 0 8 0c0-3-2-4-4-7z" fill="#fff"/>
    <rect x="148" y="160" width="100" height="56" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="160" y="182" font-family="ui-monospace,monospace" font-size="9" fill="#818cf8">export function Icon()</text>
    <text x="160" y="198" font-family="ui-monospace,monospace" font-size="9" fill="#4ade80">&lt;svg viewBox="0 0 24 24"&gt;</text>
    <text x="160" y="214" font-family="ui-monospace,monospace" font-size="9" fill="#a1a1aa">  ...props</text>
  </g>
</svg>
