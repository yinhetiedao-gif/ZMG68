<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="hero-title">
  <title id="hero-title">svg-skill</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#0f0a1e"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="400" fill="url(#bg)"/>
  <rect width="960" height="400" fill="url(#grid)"/>
  <ellipse cx="820" cy="80" rx="200" ry="160" fill="#6366f1" opacity="0.07"/>
  <ellipse cx="120" cy="340" rx="160" ry="100" fill="#a855f7" opacity="0.06"/>

  <!-- left copy -->
  <g transform="translate(56,72)">
    <rect x="0" y="0" width="88" height="28" rx="14" fill="#1e1b4b" stroke="#4c1d95" stroke-width="1"/>
    <circle cx="18" cy="14" r="4" fill="#a78bfa"/>
    <text x="32" y="18" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#c4b5fd">Agent Skill</text>

    <text x="0" y="72" font-family="system-ui,sans-serif" font-size="48" font-weight="800" fill="url(#brand)" letter-spacing="-1">svg-skill</text>
    <text x="0" y="108" font-family="system-ui,sans-serif" font-size="17" fill="#a1a1aa">Agent writes production-ready SVG</text>
    <text x="0" y="132" font-family="system-ui,sans-serif" font-size="17" fill="#71717a">Icons / Charts / Diagrams / Motion</text>

    <g transform="translate(0,160)">
      <rect x="0" y="0" width="76" height="26" rx="13" fill="#18181b" stroke="#3f3f46"/>
      <text x="38" y="17" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#a1a1aa">currentColor</text>
      <rect x="86" y="0" width="56" height="26" rx="13" fill="#18181b" stroke="#3f3f46"/>
      <text x="114" y="17" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#a1a1aa">React</text>
      <rect x="152" y="0" width="68" height="26" rx="13" fill="#18181b" stroke="#3f3f46"/>
      <text x="186" y="17" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#a1a1aa">Sprite</text>
      <rect x="230" y="0" width="52" height="26" rx="13" fill="#18181b" stroke="#3f3f46"/>
      <text x="256" y="17" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#a1a1aa">UTF-8</text>
    </g>
  </g>

  <!-- floating card: icons -->
  <g transform="translate(500,48)" filter="url(#cardShadow)">
    <rect width="200" height="140" rx="16" fill="#18181b" stroke="#27272a"/>
    <rect width="200" height="60" rx="16" fill="url(#shine)"/>
    <text x="20" y="32" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#71717a">ICONS</text>
    <g transform="translate(24,52)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#a78bfa"><circle cx="18" cy="18" r="8"/><path d="M24 24l4 4"/></g>
      <g transform="translate(52,0)" stroke="#4ade80"><path d="M18 6l4.5 9 10 1.5-7.2 7 1.7 9.8L18 26l-8-2.7 1.7-9.8-7.2-7 10-1.5z" fill="#4ade80" stroke="none"/></g>
      <g transform="translate(104,0)" stroke="#38bdf8"><path d="M18 5c-4 0-7 3-7 7 0 8 7 17 7 17s7-9 7-17c0-4-3-7-7-7z" fill="#38bdf8" stroke="none"/><circle cx="18" cy="12" r="3" fill="#18181b"/></g>
      <g transform="translate(156,0)" stroke="#fb7185"><rect x="8" y="8" width="20" height="20" rx="4"/><path d="M14 18h8M18 14v8"/></g>
    </g>
  </g>

  <!-- floating card: chart -->
  <g transform="translate(720,48)" filter="url(#cardShadow)">
    <rect width="184" height="140" rx="16" fill="#18181b" stroke="#27272a"/>
    <rect width="184" height="60" rx="16" fill="url(#shine)"/>
    <text x="20" y="32" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#71717a">CHARTS</text>
    <rect x="24" y="78" width="18" height="36" rx="3" fill="#6366f1"/>
    <rect x="50" y="62" width="18" height="52" rx="3" fill="#818cf8"/>
    <rect x="76" y="70" width="18" height="44" rx="3" fill="#6366f1"/>
    <rect x="102" y="52" width="18" height="62" rx="3" fill="#a78bfa"/>
    <polyline points="33,98 59,80 85,86 111,68" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- floating card: progress + code -->
  <g transform="translate(500,210)" filter="url(#cardShadow)">
    <rect width="200" height="148" rx="16" fill="#18181b" stroke="#27272a"/>
    <rect width="200" height="60" rx="16" fill="url(#shine)"/>
    <text x="20" y="32" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#71717a">MOTION</text>
    <circle cx="60" cy="100" r="28" fill="none" stroke="#27272a" stroke-width="5"/>
    <circle cx="60" cy="100" r="28" fill="none" stroke="url(#brand)" stroke-width="5" stroke-dasharray="120 60" stroke-linecap="round" transform="rotate(-90 60 100)" filter="url(#glow)"/>
    <path d="M120 88c0-6 5-10 12-10s12 4 12 10-5 14-12 22-12-16-12-22z" fill="#fb7185"/>
    <rect x="120" y="118" width="60" height="8" rx="4" fill="#27272a"/>
    <rect x="120" y="118" width="42" height="8" rx="4" fill="#4ade80"/>
  </g>

  <!-- floating card: flow -->
  <g transform="translate(720,210)" filter="url(#cardShadow)">
    <rect width="184" height="148" rx="16" fill="#18181b" stroke="#27272a"/>
    <rect width="184" height="60" rx="16" fill="url(#shine)"/>
    <text x="20" y="32" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#71717a">DIAGRAMS</text>
    <rect x="20" y="68" width="40" height="28" rx="5" fill="#1e3a5f" stroke="#3b82f6"/>
    <rect x="72" y="68" width="40" height="28" rx="5" fill="#422006" stroke="#f59e0b"/>
    <rect x="124" y="68" width="40" height="28" rx="5" fill="#3b0764" stroke="#a855f7"/>
    <line x1="60" y1="82" x2="72" y2="82" stroke="#52525b" stroke-width="2"/>
    <line x1="112" y1="82" x2="124" y2="82" stroke="#52525b" stroke-width="2"/>
    <rect x="20" y="110" width="144" height="24" rx="6" fill="#09090b" stroke="#27272a"/>
    <text x="30" y="126" font-family="ui-monospace,monospace" font-size="9" fill="#4ade80">&lt;svg viewBox="0 0 24 24"&gt;</text>
  </g>

  <!-- bottom wave -->
  <path d="M0,340 C160,380 320,300 480,340 C640,380 800,310 960,340 L960,400 L0,400 Z" fill="#18181b" opacity="0.6"/>
  <path d="M0,360 C200,395 400,335 600,360 C760,378 880,350 960,362 L960,400 L0,400 Z" fill="url(#brand)" opacity="0.15"/>
</svg>
